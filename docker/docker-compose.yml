version: '3.8'

networks:
  front-net:
    driver: bridge
  back-net:
    driver: bridge

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    environment:
      - NGINX_SERVER_PORT=${NGINX_SERVER_PORT}
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME}
    ports:
      - "80:80"
      - "443:443"  # Habilitamos HTTPS
    networks:
      - front-net
      - back-net
    depends_on:
      - web
      - api
      #- certbot  # Asegurar que Certbot corra antes
    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/nginx.conf  # Configuración de Nginx
      - react-build:/usr/share/nginx/html  # Archivos estáticos de React
      - certbot-www:/var/www/certbot  # Volumen para Certbot
      - certbot-conf:/etc/letsencrypt  # Certificados SSL
      #entrypoint: ["nginx", "-g", "daemon off;"]
    entrypoint: >
      /bin/sh -c "
      nginx -g 'daemon off;'"
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-www:/var/www/certbot  # Para validación
      - certbot-conf:/etc/letsencrypt  # Certificados SSL
    entrypoint: >
      /bin/sh -c "
      certbot certonly --webroot -w /var/www/certbot --agree-tos --non-interactive --email leon.can122@gmail.com                               -d apps.leonc.es -d www.apps.leonc.es"
  web:
    build:
      context: ..
      dockerfile: ./docker/web-Dockerfile
    container_name: web
    networks:
      - front-net
      - back-net
    depends_on:
      - api
    volumes:
      - react-build:/app/dist

  api:
    build:
      context: ..
      dockerfile: ./docker/backend-Dockerfile
    restart: always
    container_name: api
    environment:
      - MONGO_URI=mongodb://example:examplepassword@mongo:27017/example
      - REDIS_BROKER_URL=redis://redis:6379/0
      - REDIS_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - back-net
      - front-net
    depends_on:
      - redis
      - mongo
      - postgres
    expose:
      - "8000"

  redis:
    image: redis:latest
    container_name: redis-db
    restart: always
    networks:
      - back-net
    expose:
      - "6379"

  mongo:
    image: mongo:latest
    container_name: mongo-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: example
      MONGO_INITDB_ROOT_PASSWORD: examplepassword
    volumes:
      - mongo-data:/data/db
    networks:
      - back-net
    expose:
      - "27017"

  postgres:
    image: postgres:15
    restart: always
    container_name: postgres-db
    environment:
      POSTGRES_PASSWORD: rootpassword
    networks:
      - back-net
    expose:
      - "5432"

  worker:
    build:
      context: ..
      dockerfile: ./docker/worker-Dockerfile
    container_name: celery-worker
    command: celery -A app.celery.funds worker --loglevel=info
    networks:
     - back-net
    depends_on:
      - redis
      - api
    environment:
      - REDIS_BROKER_URL=redis://redis:6379/0
      - REDIS_RESULT_BACKEND=redis://redis:6379/0

volumes:
  mongo-data:
    driver: local
  react-build:
    driver: local
  certbot-www:
    driver: local
  certbot-conf:
    driver: local