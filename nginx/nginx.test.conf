
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    accept_mutex on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Habilitar gzip para mejorar el rendimiento
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/rss+xml text/javascript;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;

    # Limitar las solicitudes por IP
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=5r/s;

    upstream backend {
        server api:8000;
    }
    server {
    	listen 80;
    	server_name apps.leonc.es www.apps.leonc.es;
    	location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
    	}
    # Redirigir todo el tráfico HTTP a HTTPS
    # return 301 https://$host$request_uri;

    	root /usr/share/nginx/html;
    	index index.html;

    # Configuración de React SPA
    	location / {
            try_files $uri /index.html;
    	}

    # Proxy para la API backend
    	location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
